    <script src="script.js"></script>
      <script>
    (function() {
      const headingEl = document.getElementById('education-heading');
      const headingText = "Academic Background";
      function typeWriter(element, text, callback, speed = 40) {
        let i = 0;
        element.textContent = '';
        element.classList.add('has-cursor');
        function type() {
          if (i < text.length) {
            element.textContent += text.charAt(i);
            i++;
            setTimeout(type, speed);
          } else {
            element.classList.remove('has-cursor');
            if (callback) callback();
          }
        }
        type();
      }
      const certificationsHeadingEl = document.getElementById('certifications-heading');
      const certificationsHeadingText = "Certifications";

      typeWriter(headingEl, headingText, () => {
        const cards = document.querySelectorAll('.education-grid .education-card');
        cards.forEach((card, idx) => {
          setTimeout(() => card.classList.add('visible'), (idx + 1) * 250);
        });

        setTimeout(() => {
          typeWriter(certificationsHeadingEl, certificationsHeadingText, () => {
            const certCards = document.querySelectorAll('.certifications-grid .education-card');
            certCards.forEach((card, idx) => {
              setTimeout(() => card.classList.add('visible'), (idx + 1) * 200);
            });
          }, 50);
        }, 550);
      }, 50);
    })();
  </script>
