  <script src="script.js"></script>
  <script>
    (function() {
      const texts = {
        name: "Dionysios Chontzakis",
        title: "Mathematician | Data Scientist",
        aboutHeading: "About Me",
        aboutLine1: "I'm a Mathematician with a Master's in Data Science & Machine Learning.",
        aboutLine2: "I explore theoretical and practical applications of AI and ML."
      };
      const elements = {
        name: document.getElementById('typewriter-name'),
        title: document.getElementById('typewriter-title'),
        aboutHeading: document.getElementById('typewriter-about-heading'),
        aboutLine1: document.getElementById('typewriter-about-line1'),
        aboutLine2: document.getElementById('typewriter-about-line2')
      };
      const sentences = [
        { element: 'name', text: texts.name, pauseAfter: 500 },
        { element: 'title', text: texts.title, pauseAfter: 1000 },
        { element: 'aboutHeading', text: texts.aboutHeading, pauseAfter: 500 },
        { element: 'aboutLine1', text: texts.aboutLine1, pauseAfter: 500 },
        { element: 'aboutLine2', text: texts.aboutLine2, pauseAfter: 2000 }
      ];
      let currentIndex = 0, currentChar = 0, currentEl = null, fullText = '', timer = null;
      function setCursor(el, show) { if (el) show ? el.classList.add('has-cursor') : el.classList.remove('has-cursor'); }
      function clearCursors() { Object.values(elements).forEach(el => setCursor(el, false)); }
      function typeNext() {
        if (currentChar < fullText.length) {
          currentEl.textContent += fullText[currentChar];
          currentChar++;
          timer = setTimeout(typeNext, 40);
        } else {
          setCursor(currentEl, true);
          if (currentIndex < sentences.length - 1) {
            setTimeout(() => {
              setCursor(currentEl, false);
              currentIndex++;
              startCurrent();
            }, sentences[currentIndex].pauseAfter);
          }
        }
      }
      function startCurrent() {
        const s = sentences[currentIndex];
        currentEl = elements[s.element];
        fullText = s.text;
        currentChar = 0;
        currentEl.textContent = '';
        clearCursors();
        setCursor(currentEl, true);
        typeNext();
      }
      Object.values(elements).forEach(el => { if (el) el.textContent = ''; });
      startCurrent();
    })();
  </script>
